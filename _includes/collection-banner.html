{% if page.layout == "home-fpj" and site.data.theme.featured-image %}
<style>
#home-banner { background-image: url('{% include image/featured-image.html %}'); background-position: {{ site.data.theme.home-banner-image-position | default: 'center' }}; }
#home-title-box { padding-top: {{ site.data.theme.home-title-y-padding | default: '8em' }}; }
</style>
<header id="home-banner">
    <div id="home-title-box">
        <h1 class="site-wordmark">{{ site.title }}</h1>
        {% if site.tagline %}<p class="site-tagline">{{ site.tagline }}{% if site.lifespan %} <span class="site-lifespan">{{ site.lifespan }}</span>{% endif %}</p>{% endif %}
    </div>
</header>
{%- else -%}
<header id="page-banner">
    <div class="container">
        <a class="site-wordmark" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        {% if site.tagline %}<span class="site-tagline">{{ site.tagline }}</span>{% endif %}
    </div>
</header>
{%- endif -%}
